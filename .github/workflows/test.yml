# PR と main への push で自動テストを実行する。
# main のブランチ保護で、このワークフローの "test" ジョブを必須チェックに指定する。
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt pytest pytest-asyncio
          fi

      # テストがまだ無いブランチでも失敗しないよう、存在する場合だけ実行する
      - name: Python テスト (pytest)
        run: |
          if [ -d tests/python ]; then
            python -m pytest
          else
            echo "tests/python が無いためスキップ"
          fi

      - name: JavaScript テスト (npm test)
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "package.json が無いためスキップ"
          fi
